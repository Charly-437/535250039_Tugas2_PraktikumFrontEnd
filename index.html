<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombol Data Diri (Kartu)</title>
    <style>
        /* Styling body */
        body {
            font-family:Arial, Helvetica, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: rgb(255, 255, 224);
        }

        /* Styling box */
        .box {
            background-color: rgb(249, 249, 196);
            border-radius: 8px;
            margin: 20px auto;
            padding: 20px;
            max-width: 1000px;
            box-sizing: border-box;
        }

        /* Styling tombol */
        button {
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            margin: 5px;
        }

        #btn-tampil {
            background-color: rgb(239, 187, 43);
            color: white;
        }

        #btn-hapus {
            background-color: rgb(255, 90, 90);
            color: whitesmoke;
        }

        /* Styling card agar responsif */
        .card {
            margin: 20px auto;
            padding: 15px;
            width: 100%;
            max-width: 450px;
            background: rgb(248, 229, 144);
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            display: none; /* sembunyikan card di awal */
            box-sizing: border-box; /* agar tidak overflow */
        }

        /* Gambar responsif */
        .profil img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%; /* gambar jadi lingkaran */
            padding: 2px;
            border: 2px solid #fff;
        }

        /* Tabel data diri */
        .data {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td { 
            padding: 6px 4px; 
            font-size: 16px; 
            text-align: left;
        }

        th {
            width: 30%;
        }

        /* Penyesuaian layar*/
        @media (max-width: 480px) {
            body {
                margin: 10px;
            }
            .box {
                margin: 10px auto;
                padding: 15px;
            }
            th, td {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <!-- Kata kata -->
        <h2>Data Diri Pembuat</h2>
        <p>Mau kenalan sama pembuat? Coba tekan tombol "<strong>Tampilkan</strong>"</p>

        <!-- Tombol -->
        <button id="btn-tampil">Tampilkan</button>
        <button id="btn-hapus">Hapus</button>

        <!-- Kartu identitas -->
        <div id="kartu" class="card">
            <h2>Kartu Identitas</h2>
            <div class="profil">
                <!-- Gambar hanya hiasan -->
                <img src="gambar.jpg" alt="nailong">
            </div>
            <div class="data">
                <!-- Data diri menggunakan table agar tampilan lebih rapih -->
                <table>
                    <tr>
                        <th>Nama</th>
                        <td>:</td>
                        <td>Charly</td>
                    </tr>
                    <tr>
                        <th>NIM</th>
                        <td>:</td>
                        <td>535250039</td>
                    </tr>
                    <tr>
                        <th>Jurusan</th>
                        <td>:</td>
                        <td>Teknik Informatika</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        // Mengambil elemen tombol dan kartu
        const btnTampil = document.getElementById("btn-tampil");
        const btnHapus = document.getElementById("btn-hapus");
        const kartu = document.getElementById("kartu");

        // Menambahkan event listener untuk tombol tampilkan
        btnTampil.addEventListener("click", function() {
            kartu.style.display = "block";
        });

        // Menambahkan event listener untuk tombol hapus
        btnHapus.addEventListener("click", function() {
            kartu.style.display = "none";
        });
    </script>
</body>
</html>
